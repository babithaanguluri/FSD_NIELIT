<!DOCTYPE html>
<html>
<head>
    <title>Login Page</title>
</head>

<body>

    <h2>Login Page</h2>

    {% if error %}
        <script>
            alert("{{ error }}");
        </script>
    {% endif %}


    <form method="POST">

        {% csrf_token %}

        {{ form.email.label_tag }}
        {{ form.email }}

        <br><br>

        {{ form.password.label_tag }}
        {{ form.password }}

        <br><br>

        <button type="submit">Login</button>

    </form>

    <br>

    <p>
        If you do not have account
        <a href="{% url 'register' %}">Register</a>
    </p>

</body>
</html>
