<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid</title>
    <link rel="stylesheet" href="./index.css">
</head>
<body>
    <section class="col-12 row">
        <div class="col-3">
            <div class="h-50 row bg-brown"></div>
            <div class="h-50 row bg-yellow"></div>        
        </div>
        <div class="col-9">
            <div class="h-30 row">
                <div class="col-6 bg-violet"></div>
                <div class="col-6 bg-aqua"></div>
            </div>
            <div class="h-70 row">
                <div class="col-9 column">
                    <div class="h-60 row">
                        <div class="col-4 bg-blue"></div>
                        <div class="col-8 bg-orange"></div>
                    </div>
                    <div class="h-40 row">
                        <div class="col-9 bg-red"></div>
                        <div class="col-3 bg-grey"></div>
                    </div>
                </div>
                <div class="col-3 bg-pink"></div>
            </div>
        </div>
    </section>
</body>
</html>
